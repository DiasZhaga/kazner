# Reproduces the pilot run behind test F1 = 0.9020: ner-project/src/run_peft_comparison.py
# with method=full, fraction=0.10, 3 epochs (results/peft_comparison/full_10pct_metrics.json).
# Relative paths are resolved against the directory of this file.
name: pilot_full_10pct
data:
  dir: ../data/kaznerd
  train_fraction: 0.10
  subsample_seed: 42
model:
  name: bert-base-multilingual-cased
  max_len: 128
method:
  name: full
training:
  learning_rate: 5.0e-5
  epochs: 3
  train_batch_size: 4
  eval_batch_size: 8
  grad_accumulation: 2
  weight_decay: 0.01
  fp16: auto
  load_best_model_at_end: true
  logging_steps: 50
seeds: [42]
output_root: ../runs
