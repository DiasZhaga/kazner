# Baseline learning-rate screen (#32) at 10% KazNERD, seed 42. Same protocol as the mBERT
# runs of experiment B except the learning rate. Baselines, not causal evidence: see
# docs/baselines.md. Select the rate by VALIDATION F1 (metrics.json: validation_best), never
# by test; if the best rate is at the edge of the grid, extend the grid by one step first.
name: baseline_kazroberta_lr1e-4
data:
  dir: ../../data/kaznerd
  train_fraction: 0.10
  subsample_seed: 42
model:
  name: kz-transformers/kaz-roberta-conversational
  revision: "43077c2fd0a163487ed468b5ec3b8750686a5888"  # pinned Hub commit (#31)
  add_prefix_space: true  # byte-level BPE (#30)
  max_len: 128
method:
  name: full
training:
  learning_rate: 1.0e-4
  epochs: 3
  train_batch_size: 4
  eval_batch_size: 8
  grad_accumulation: 2
  weight_decay: 0.01
  fp16: auto
  load_best_model_at_end: true
  logging_steps: 50
seeds: [42]
output_root: ../../runs
