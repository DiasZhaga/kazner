# Grid extension (#32): the best screen rate was at the top edge of the grid, so the grid is
# extended by one step before choosing (docs/baselines.md). Seed 42, protocol as the screen.
name: baseline_kazroberta_lr2e-4
data:
  dir: ../../data/kaznerd
  train_fraction: 0.10
  subsample_seed: 42
model:
  name: kz-transformers/kaz-roberta-conversational
  revision: "43077c2fd0a163487ed468b5ec3b8750686a5888"  # pinned Hub commit (#31)
  add_prefix_space: true  # byte-level BPE (#30)
  max_len: 128
method:
  name: full
training:
  learning_rate: 2.0e-4
  epochs: 3
  train_batch_size: 4
  eval_batch_size: 8
  grad_accumulation: 2
  weight_decay: 0.01
  fp16: auto
  load_best_model_at_end: true
  logging_steps: 50
seeds: [42]
output_root: ../../runs
