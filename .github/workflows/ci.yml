name: CI

# Pull requests are checked on their own trigger; pushes are checked on main only,
# so that a PR branch is not tested twice for every commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff (version pinned in pyproject.toml)
        run: python -m pip install "$(grep -oE 'ruff==[0-9.]+' pyproject.toml)"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch
        run: python -m pip install "torch>=2.5,<3" --index-url ${{ env.TORCH_CPU_INDEX }}
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests with coverage
        run: >-
          python -m pytest -m "not network and not smoke"
          --cov=kazner --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=junit.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            junit.xml

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Hugging Face models and tokenizers
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Install CPU-only PyTorch
        run: python -m pip install "torch>=2.5,<3" --index-url ${{ env.TORCH_CPU_INDEX }}
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run network and smoke tests
        run: python -m pytest -m "network or smoke" -v
