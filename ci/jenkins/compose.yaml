# Local Jenkins for kazner:  docker compose -f ci/jenkins/compose.yaml up -d --build
# Settings come from ci/jenkins/.env (not committed; copy .env.example).
name: kazner-jenkins

services:
  jenkins:
    build: .
    image: kazner-jenkins:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in ci/jenkins/.env}
      DOCKERHUB_REPO: ${DOCKERHUB_REPO:-}
    # Builds use the host Docker engine (images built here are visible to Docker Desktop's
    # Kubernetes). The socket belongs to group 0, so that group is added instead of running
    # Jenkins as root.
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - kubeconfig

secrets:
  kubeconfig:
    file: ./secrets/kubeconfig

volumes:
  jenkins_home:
