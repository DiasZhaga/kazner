[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazner"
version = "0.1.0rc1"
description = "Kazakh named entity recognition toolkit: IOB2 data, label alignment, a word-level prediction contract and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dias Zhagaparov" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# Pinned to the versions used by the pilot experiments (../ner-project).
dependencies = [
    "torch>=2.5,<3",
    "transformers==5.0.0",
    "datasets==4.5.0",
    "peft==0.19.1",
    "accelerate==1.12.0",
    "seqeval==1.2.2",
    "numpy",
    "pandas",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.16.10",
    "build>=1.2",
]

[project.scripts]
kazner = "kazner.cli:main"

[project.urls]
Repository = "https://github.com/DiasZhaga/kazner"
Issues = "https://github.com/DiasZhaga/kazner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Verbatim copies of pilot code used as test oracles; kept unformatted on purpose.
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: downloads a model or tokenizer from the Hugging Face Hub",
    "smoke: end-to-end training on a tiny model",
]

[tool.coverage.run]
source = ["kazner"]
branch = true
omit = ["*/kazner/__main__.py"]

[tool.coverage.report]
show_missing = true
